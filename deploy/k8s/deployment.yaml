apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragontts
  namespace: beta
  labels:
    app: dragontts
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: dragontts
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: dragontts
    spec:
      containers:
      - name: dragontts
        image: asia-south1-docker.pkg.dev/breeze-automatic-prod/dragontts/dragontts:latest
        imagePullPolicy: Always
        env:
        - name: DB_PATH
          value: /app/data/dragontts.db
        - name: BLOB_DIR
          value: /app/data/blobs
        - name: MAX_CACHE_BYTES
          value: '0'
        - name: ENABLE_WRITE_THROUGH
          value: 'true'
        - name: CARTESIA_STREAM_POOL_SIZE
          value: '5'
        - name: SARVAM_STREAM_POOL_SIZE
          value: '5'
        - name: ELEVENLABS_STREAM_POOL_SIZE
          value: '16'
        - name: GOOGLE_CREDENTIALS_JSON
          value: ''
        - name: PROVIDER_RESILIENCE
          value: '{"cartesia":{"max_concurrent":10,"wait_timeout_ms":3000},"sarvam":{"max_concurrent":10,"wait_timeout_ms":3000},"elevenlabs":{"max_concurrent":30,"wait_timeout_ms":3000},"gemini":{"max_concurrent":30,"wait_timeout_ms":3000}}'
        - name: CARTESIA_WS_FORCE_IPV4
          value: 'true'
        - name: THREAD_POOL_WORKERS
          value: '32'
        - name: BULK_CREATE_MAX
          value: '100'
        - name: CARTESIA_API_KEY
          value: ''
        - name: SARVAM_API_KEY
          value: ''
        - name: ELEVENLABS_INDIAN_RESIDENCY_API_KEY
          value: ''
        - name: SLACK_WEBHOOK_URL
          value: ''
        - name: SLACK_SUMMARY_TIME_UTC
          value: '16:30'
        - name: SLACK_COST_PER_WORD
          value: '{"cartesia":0.000002,"elevenlabs":0.00032,"gemini":0.00016,"sarvam":0.000005}'
        - name: SPLIT_AT_SYMBOLS
          value: ''
        # --- Graceful drain / clairvoyance kill switch (empty => kill-switch POST is a no-op;
        # inject CLAIRVOYANCE_URL + a clairvoyance admin JWT via kubectl set env) ---
        - name: CLAIRVOYANCE_URL
          value: ''
        - name: CLAIRVOYANCE_JWT_TOKEN
          value: ''
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        # ADDED: fire the kill switch to clairvoyance BEFORE SIGTERM.
        lifecycle:
          preStop:
            httpGet:
              path: /drain
              port: http
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 3
        # CHANGED: /health -> /ready (returns 503 while draining => k8s stops routing new traffic).
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 3
        resources:
          limits:
            cpu: '2'
            ephemeral-storage: 2Gi
            memory: 6000Mi
          requests:
            cpu: 1500m
            ephemeral-storage: 1Gi
            memory: 3000Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/data
          name: data
          subPath: data
      dnsPolicy: ClusterFirst
      nodeSelector:
        cloud.google.com/gke-nodepool: dragontts-pool
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      # CHANGED: 30 -> 150 (30 SIGKILL'd mid-drain; needs ~110 for preStop + uvicorn 100s + cleanup).
      terminationGracePeriodSeconds: 150
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: dragontts
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dragontts-data
